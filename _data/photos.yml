# Crédits photos
# -----------------------------------------------------------------
# 1. Déclare chaque photographe UNE fois dans "photographes"
#    (un identifiant court, puis son nom et un lien : Instagram, site...).
# 2. Dans "photos", associe chaque fichier de assets/images/photos/
#    à l'identifiant du photographe.
# Le crédit s'affiche alors sous la photo, partout où elle est utilisée,
# et le photographe apparaît dans les remerciements de la page À propos.
#
# Les noms de fichiers suivent la course : <course>-<numéro>.jpg
# "course" relie la photo à un résultat (pour la légende automatique).
# "portrait: true" : photo verticale, affichée entière dans les carrousels.
# "cadrage" (facultatif) : quelle partie de la photo garder quand elle est
# recadrée, ex. "center 20%" (20 % = plus près du haut), "left top"...

photographes:
  bernardeau:
    nom: "@bernardeau.outdoor"
    lien: "https://www.instagram.com/bernardeau.outdoor/"
  juulien:
