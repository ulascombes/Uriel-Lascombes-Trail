# Une course = un bloc. Copie un bloc existant en haut et remplis-le.
# Laisse vide ce que tu n'as pas. Le tri par date est automatique.
#
# ref         : identifiant court, sans espace ni accent (ex. volx-2026).
#               Si un fichier _recits/<ref>.md existe, le lien "Récit" apparaît tout seul.
# temps       : format h:mm:ss (ex. 1:57:33)
# classement  : place au scratch (1, 2, 3 => médaille automatique)
# mention     : texte court affiché à côté du nom (ex. "Championnat de France", "Blessure")
# challenges  : liste des challenges dont la course fait partie (voir _data/challenges.yml)
# commentaire : une phrase, affichée sous la ligne
# chaussures  : modèle porté

