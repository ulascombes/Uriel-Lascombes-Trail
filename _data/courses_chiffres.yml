# Analyse chiffrée affichée sur la page de récit (bloc « La course en chiffres »).
# Une entrée par course, avec le même ref que dans resultats.yml. Tout est facultatif.
#
# pointages : place et avance (ou retard) à chaque point de contrôle, d'après les résultats officiels.
#   km : distance d'après ma montre ; temps : mon temps officiel au pointage ;
#   allure : allure du tronçon depuis le pointage précédent (distance de ma montre) ;
#   x / y : position du repère sur le profil (en %), calculée par Claude.
# pointages_montre: true => pas de pointage officiel : repères choisis sur ma trace, temps et allures d'après ma montre (sans place).
# montee : la portion du profil à surligner en bleu foncé (tracé SVG dans le repère 1000 × 40 du profil),
#   montee_legende : la légende affichée sous le profil.
# chiffres : 2 à 4 faits marquants. titre en gras, texte court (le HTML <b> est accepté).
#   saison: true => repère de saison (record de la saison qui fait le lien entre les courses).

