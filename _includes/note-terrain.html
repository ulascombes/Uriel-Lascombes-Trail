{%- comment -%} Note de 1 à 5, affichée en 5 segments. Variables : note, note_num (true pour afficher « 4/5 ») {%- endcomment -%}
{%- if note -%}
<span class="note" role="img" aria-label="{{ note }} sur 5">{% for i in (1..5) %}<span class="note-seg{% if i <= note %} on{% endif %}"></span>{% endfor %}{% if note_num %}<span class="note-num">{{ note }}/5</span>{% endif %}</span>
{%- else -%}
<span class="note-vide" aria-label="pas encore noté">–</span>
{%- endif -%}
