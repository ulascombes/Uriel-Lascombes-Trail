title: Uriel Lascombes
description: "Trail court en Provence. Résultats, récits de course et matériel."
lang: fr

# Le dépôt s'appelle Uriel-Lascombes-Trail : GitHub Pages le sert donc à
# https://ulascombes.github.io/Uriel-Lascombes-Trail/
# Si tu passes un jour sur un nom de domaine (ex. urielascombes.fr),
# remplace url par ce domaine et vide baseurl ("").
url: "https://ulascombes.github.io"
baseurl: "/Uriel-Lascombes-Trail"

collections:
  recits:
    output: true
    permalink: /recits/:name/
  # Pour plus tard : un fichier .md par paire testée dans _tests/
  tests:
    output: true
    permalink: /tests/:name/

defaults:
  - scope:
      path: ""
      type: recits
    values:
      layout: recit
  - scope:
      path: ""
      type: tests
    values:
      layout: test

exclude:
  - outils/
  - README.md
  - Gemfile
  - Gemfile.lock
  - "Claude outputs"
