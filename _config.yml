title: Uriel Lascombes
description: "Trail court en Provence. Résultats, récits de course et matériel."
lang: fr

# Site servi sur le domaine perso (acheté chez OVH, fichier CNAME à la racine).
url: "https://uriellascombes.fr"
baseurl: ""

collections:
  recits:
    output: true
    permalink: /recits/:name/
  # Pour plus tard : un fichier .md par paire testée dans _tests/
  tests:
    output: true
    permalink: /tests/:name/

defaults:
  - scope:
      path: ""
      type: recits
    values:
      layout: recit
  - scope:
      path: ""
      type: tests
    values:
      layout: test

exclude:
  - "Claude outputs"
  - README.md
  - Gemfile
  - Gemfile.lock
